<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - FoodBook</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                Food<span>Book</span>
            </a>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </header>


    <main class="auth-page">

        <div class="auth-container register-container">

            <div class="auth-header">

                <div class="auth-icon">
                    🍽️
                </div>

                <h1>Create your account</h1>

                <p>
                    Join FoodBook and start ordering delicious meals.
                </p>

            </div>


            <div id="authMessage" class="message hidden"></div>


            <form id="registerForm" class="auth-form">


                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        name="phone"
                        class="form-control"
                        placeholder="08012345678"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        class="form-control"
                        placeholder="e.g. Makurdi"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            class="form-control"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="registerPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            class="form-control"
                            placeholder="Repeat your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <label class="terms-label">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">
                            Terms and Conditions
                        </a>
                    </span>

                </label>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <footer class="simple-footer">

        <p>
            &copy; 2026 FoodBook. All rights reserved.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>
</html>
